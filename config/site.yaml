# 内网迁移主要修改此文件。密码、SSH 私钥、Registry 密码通过 Secret 配置。
namespace: jenkins
release: jenkins
nodePort: 32080
jenkinsUrl: http://10.2.0.119:32080/
storageClass: jenkins-local-path
pvcSize: 250Gi
# 下列构建参数只在首次启动时导入；之后在 Manage Jenkins → 系统配置 → 构建平台设置 修改。
concurrency: 6
buildCpuLimit: 4
buildMemoryGiB: 8
dindMemoryGiB: 4
temporaryStorageGiB: 20
minimumFreeGiB: 50
minimumFreePercent: 10
buildTimeoutMinutes: 240
agentStartupTimeoutMinutes: 15
compilerImagePullPolicy: Always
# 编译镜像私有仓库的 Kubernetes Secret 名称；与业务镜像推送凭据分别配置。
compilerImagePullSecrets: []
demo: true
# demo 模式使用同命名空间只读 Git 镜像及独立 Registry。
gitUrl: http://xran-demo:8000/X-RAN-CLOUD.git
gitCredentialsId: ''
registry: xran-registry:5000
registryCredentialsId: ''
registryInsecure: true
services: [serviceA, serviceB, serviceC]
images: [imageA, imageB, imageC]
# 真实项目镜像名到 Registry 仓库路径的映射，供元数据与推送检查使用。
imageRepositories: {imageA: xran-demo/imagea, imageB: xran-demo/imageb, imageC: xran-demo/imagec}
open5gs:
  gitUrl: http://xran-demo:8000/open5gs.git
  gitCredentialsId: ''
  # 初次导入的离线模式；后续在构建平台设置修改，构建页面不提供此参数。
  offline: true
  registry: 192.168.10.35
  registryCredentialsId: ''
  registryInsecure: true
  ubuntuImage: 192.168.10.35/xnet/ubuntu:22.04
  vppImage: 192.168.10.35/xcn/vpp:26.06
  innerBuildMemoryGiB: 3
  buildJobs: 2
# 集群、Git、Registry、apt 源始终绕过代理。内网一般留空。
proxy: ''
noProxy: localhost,127.0.0.1,.svc,.cluster.local,10.2.0.119,172.30.0.0/16,192.168.10.0/24
